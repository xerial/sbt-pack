# The plugin is compiled against sbt 2.0.0 (pluginCrossBuild / sbtVersion in build.sbt), which runs on Scala 3.8.x.
# A newer Scala 3 produces TASTy that sbt cannot read, so keep scala3-library on 3.8.x.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.8." }
]
